name: CI
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Reviewed base commit for dependency comparison
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    # Cold macOS lint, test and release builds exceeded the previous 20-minute budget.
    timeout-minutes: ${{ startsWith(matrix.platform, 'macos-') && 30 || 20 }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NO_COLOR: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confine temp and caches to this checkout
        run: ./scripts/ci-environment.ps1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, checked 2026-10-10
        with:
          toolchain: '1.99.1'
          components: ${{ startsWith(matrix.platform, 'macos-') && 'rustfmt, clippy, llvm-tools' || 'rustfmt, clippy' }}
      - name: Use project-contained toolchain executables
        run: ./scripts/ci-environment.ps1 -ToolchainPath
      - name: Verify pinned macOS stripping tool before compilation
        if: startsWith(matrix.platform, 'macos-')
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-ToolEvent {
            param([ValidateSet('INFO', 'WARNING', 'ERROR', 'DEBUG')][string]$Level, [string]$Message)
            [Console]::Error.WriteLine(('[{0}] [{1}] [toolchain-check] {2}' -f [DateTime]::UtcNow.ToString('o'), $Level, $Message))
          }
          try {
            Write-ToolEvent INFO 'Checking the pinned macOS stripping tool and its runtime libraries.'
            $sysroot = & rustc --print sysroot
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the pinned sysroot.' }
            $version = @(& rustc -vV)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the pinned compiler host.' }
            $hostLine = @($version | Where-Object { $_ -like 'host: *' })
            if ($hostLine.Count -ne 1) { throw 'Invalid compiler host metadata.' }
            $hostTriple = $hostLine[0].Substring(6).Trim()
            if ($hostTriple -notin @('aarch64-apple-darwin', 'x86_64-apple-darwin')) { throw 'Unexpected compiler host.' }
            $tool = Join-Path $sysroot.Trim() "lib/rustlib/$hostTriple/bin/rust-objcopy"
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw 'Pinned stripping tool missing.' }
            Write-ToolEvent DEBUG 'Executing rust-objcopy from the active pinned sysroot, not a PATH substitute.'
            & $tool --version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Pinned stripping tool failed to load.' }
            Write-ToolEvent INFO 'Pinned stripping tool runtime verified.'
          } catch {
            Write-ToolEvent WARNING 'Check the matching llvm-tools component; do not disable stripping as a workaround.'
            Write-ToolEvent ERROR 'Pinned macOS stripping preflight failed; packaging is blocked.'
            throw
          }
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Validate source inventory and UTF-8
        run: ./scripts/check.ps1
      - name: Verify release build policy and failed-publication boundaries
        timeout-minutes: 2
        run: ./scripts/check-build-policy.ps1
      - name: Check formatting
        run: ./scripts/verify.ps1 -CargoArgs @('fmt', '--check')
      - name: Check Rust lints
        run: ./scripts/verify.ps1 -CargoArgs @('clippy', '--locked', '--all-targets', '--', '-D', 'warnings')
      - name: Run every bounded test
        run: ./scripts/verify.ps1 -CargoArgs @('nextest', 'run', '--locked', '--all-targets', '--profile', 'ci', '--no-fail-fast')
      - name: Build and smoke native launcher
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sandbox = Join-Path $PWD '.ci-work/launcher smoke'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item ./run.ps1 $sandbox
          Copy-Item ./bin (Join-Path $sandbox 'bin') -Recurse
          & (Join-Path $sandbox 'run.ps1') -Preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $IsWindows) {
            & sh -n ./build.sh
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & sh ./run.sh preview
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify launcher startup boundaries
        timeout-minutes: 7
        run: ./scripts/check-launcher-boundaries.ps1
      - name: Verify safe cache cleanup
        run: ./scripts/check-cleanup.ps1
      - name: Package and verify downloadable native archive
        run: ./scripts/package.ps1 -Platform '${{ matrix.platform }}' -SourceSha '${{ github.sha }}'
      - name: Verify real Linux command and initialization contracts
        if: matrix.platform == 'linux-x64'
        timeout-minutes: 15
        run: |
          python3 -m venv .ci-work/native-probe-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $PWD '.ci-work/native-probe-env/bin/python'
          & $python -m pip install --disable-pip-version-check cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem dist/upwork-agent-plugin-*-linux-x64.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected one packaged Linux binary.' }
          & $python -I tests/native/run.py --archive $archives[0].FullName --output .ci-work/native-acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload ready-to-run archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upwork-${{ matrix.platform }}
          path: |
            dist/upwork-agent-plugin-*-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload standalone skills plugin
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upwork-skills-plugin
          path: dist/upwork-selection-plugin-*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.platform }}
          path: |
            target/nextest/ci/junit.xml
            .ci-work/rust-verification.json
            .ci-work/build-policy.json
            .ci-work/launcher-boundaries.json
            .ci-work/native-acceptance/*.json
            .ci-work/native-acceptance/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confine audit installer, temp and caches to this checkout
        run: ./scripts/ci-environment.ps1
        shell: pwsh
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo-audit audit --deny warnings
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          HOME: ${{ github.workspace }}/.ci-cache/home
          USERPROFILE: ${{ github.workspace }}/.ci-cache/home

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
    with:
      base_ref: ${{ inputs.base_ref }}
