name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Windows Node 24 checks
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NO_COLOR: '1'
      NODE_OPTIONS: ''
      NODE_DEBUG: ''
      NODE_USE_ENV_PROXY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --cache ./.cache/npm
      - name: Validate text and native source syntax
        run: npm run check
      - name: Run all bounded regression tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high --cache ./.cache/npm
